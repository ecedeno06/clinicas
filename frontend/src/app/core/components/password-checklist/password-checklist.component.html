@if (politica) {
  <ul class="password-checklist">
    @for (item of items(); track item.label) {
      <li [class.ok]="item.cumple" [class.bad]="!item.cumple">
        <span class="icon" aria-hidden="true">{{ item.cumple ? '✅' : '❌' }}</span>
        <span class="label">{{ item.label }}</span>
        @if (item.detalle) {
          <span class="detalle">&rarr; {{ item.detalle }}</span>
        }
        @if (item.ejemplos?.length) {
          <span class="detalle">
            &rarr;
            @for (e of item.ejemplos; track e) {
              <code class="chip">{{ e }}</code>
            }
          </span>
        }
      </li>
    }
  </ul>
}
